[package]
name = "allwright"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "allwright CLI that bundles the lightweight engine core and plugin management."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["automation", "cli", "testing", "plugin"]
categories = ["development-tools::testing", "command-line-utilities"]

[[bin]]
name = "allwright"
path = "src/main.rs"

[dependencies]
allwright = { package = "allwright-core", path = "../allwright", version = "0.0.50", features = ["server"] }
allwright-plugin-sdk = { path = "../allwright-plugin-sdk", version = "0.0.50" }
clap = { workspace = true, features = ["derive"] }
flate2 = { workspace = true }
libloading = { workspace = true }
reqwest = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
zip = { workspace = true }
