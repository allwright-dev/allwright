<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Allwright Inspector</title>
  <style>
    :root { color-scheme: dark; --bg:#0a0d12; --panel:#111620; --line:#252c38; --muted:#8d98aa; --text:#eef2f8; --accent:#7ce2bd; --select:#67a9ff; }
    * { box-sizing:border-box } body { margin:0; height:100vh; overflow:hidden; background:var(--bg); color:var(--text); font:13px/1.45 ui-sans-serif,system-ui,sans-serif }
    header { height:54px; display:flex; align-items:center; gap:12px; padding:0 18px; border-bottom:1px solid var(--line); background:#0d1118 }
    .mark { width:28px; height:28px; display:grid; place-items:center; border-radius:8px; color:#07110e; background:var(--accent); font-weight:900 }
    header strong { font-size:15px } header span { color:var(--muted) } button,input,select { font:inherit } button { border:1px solid var(--line); border-radius:7px; padding:7px 11px; color:var(--text); background:#171e29; cursor:pointer } button:hover { border-color:#4d5a6d } button.primary { color:#06120d; border-color:var(--accent); background:var(--accent); font-weight:700 } .spacer { flex:1 } #windowControl { display:flex; align-items:center; gap:7px; color:var(--muted) } #windowControl[hidden] { display:none } #windowSelect { max-width:260px; padding:6px 28px 6px 9px; border:1px solid var(--line); border-radius:7px; color:var(--text); background:#171e29 }
    .modeSwitch { display:flex; padding:3px; border:1px solid var(--line); border-radius:9px; background:#090d13 } .modeSwitch button { padding:5px 10px; border:0; background:transparent } .modeSwitch button.active,#freeze.active { color:#07110e; border-color:var(--accent); background:var(--accent); font-weight:750 }
    main { height:calc(100vh - 54px); min-height:0; display:grid; grid-template-columns:minmax(460px,1fr) 360px 330px }
    section { min-width:0; min-height:0; height:100%; overflow:hidden; border-right:1px solid var(--line); background:var(--panel) } .title { height:42px; display:flex; align-items:center; padding:0 14px; border-bottom:1px solid var(--line); color:#cbd3df; font-weight:650 }
    #stageWrap { height:calc(100% - 42px); display:flex; align-items:center; justify-content:center; overflow:hidden; padding:24px; background-color:#090c11; background-image:radial-gradient(#26303d 1px,transparent 1px); background-size:18px 18px }
    #stage { position:relative; flex:0 0 auto; outline:none; box-shadow:0 18px 60px #000a } #shot { display:block; width:100%; height:100%; object-fit:contain; cursor:crosshair; user-select:none; -webkit-user-drag:none } body.interactMode #shot { cursor:pointer; touch-action:none } body.interactMode #stage:focus { box-shadow:0 0 0 2px var(--accent),0 18px 60px #000a }
    #highlight { position:absolute; pointer-events:none; border:2px solid var(--select); background:#67a9ff25; box-shadow:0 0 0 1px #07111dcc; display:none }
    #tree { height:calc(100% - 42px); min-height:0; overflow:auto; overscroll-behavior:contain; scrollbar-gutter:stable; padding:8px } .node { width:max-content; min-width:100%; white-space:nowrap } .nodeRow { display:flex; align-items:center; gap:5px; min-height:25px; padding:2px 6px; border-radius:5px; cursor:pointer } .nodeRow:hover { background:#1a2230 } .nodeRow.active { background:#19304d; color:#fff } .twisty { width:12px; color:#647186 } .role { color:var(--accent) } .name { color:#d8dee8 } .children { margin-left:14px }
    #details { height:calc(100% - 42px); min-height:0; overflow:auto; overscroll-behavior:contain; scrollbar-gutter:stable; padding:14px } .empty { color:var(--muted); padding:16px 2px } .property { display:grid; grid-template-columns:100px 1fr; gap:8px; padding:7px 0; border-bottom:1px solid #202733 } .property label { color:var(--muted) } .property div { min-width:0; overflow-wrap:anywhere } .locator { margin:15px 0 8px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em } .locatorList { display:grid; gap:8px } .locatorItem { border:1px solid var(--line); border-radius:7px; overflow:hidden; background:#090d13 } .locatorHead { display:flex; align-items:center; justify-content:space-between; min-height:30px; padding:3px 5px 3px 10px; border-bottom:1px solid var(--line); color:var(--muted); font-size:11px; font-weight:700 } .locatorHead button { padding:3px 7px; border:0; background:transparent; font-size:11px } code { display:block; padding:10px; color:#b7ddff; overflow-wrap:anywhere; white-space:pre-wrap } .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px } .interactionFields { display:grid; gap:8px; margin-top:10px } .actionField { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:7px } .actionField input { min-width:0; padding:8px 9px; border:1px solid var(--line); border-radius:7px; outline:none; color:var(--text); background:#090d13 } .actionField input:focus { border-color:var(--select) } #status.error { color:#ff8c8c }
    @media (max-width:1000px) { main { grid-template-columns:1fr 330px } section.treePane { display:none } }
  </style>
</head>
<body>
  <header><div class="mark">A</div><strong>Allwright Inspector</strong><span id="surface">desktop · native</span><div class="spacer"></div><label id="windowControl" hidden>Window <select id="windowSelect" aria-label="Application window"></select></label><div class="modeSwitch" aria-label="Inspector mode"><button id="inspectMode" class="active">Inspect</button><button id="interactMode">Interact</button></div><span id="status">Connecting…</span><button id="freeze" title="Hold the current screenshot and hierarchy (F8)">Freeze</button><button id="refresh">Refresh</button></header>
  <main>
    <section><div class="title">Application window</div><div id="stageWrap"><div id="stage" tabindex="0" aria-label="Live application screen"><img id="shot" draggable="false"><div id="highlight"></div></div></div></section>
    <section class="treePane"><div class="title">Element hierarchy</div><div id="tree"></div></section>
    <section><div class="title">Element details</div><div id="details"><div class="empty">Choose an element in the screenshot or hierarchy.</div></div></section>
  </main>
  <script>
    const $ = id => document.getElementById(id); let root, nodes=[], selected, mode='inspect', frozen=false, clickTimer, scrollTimer, textTimer, textBuffer='', pointerStart, suppressClickUntil=0, liveGeneration=0, frameCount=0, liveStarted=0, frameUrl, currentWindowId, windowPollBusy=false, inputQueue=Promise.resolve();
    function flatten(node, depth=0, parent) { if (!node) return; node._depth=depth;node._parent=parent; nodes.push(node); (node.children||[]).forEach(n=>flatten(n,depth+1,node)); }
    function locatorSegments(n) { const result=[];if(n.automationId)result.push({kind:'testId',value:String(n.automationId),spec:{kind:'testId',text:String(n.automationId)}});if(n.name)result.push({kind:'role',value:String(n.role||'custom'),name:String(n.name),spec:{kind:'role',role:String(n.role||'custom'),name:String(n.name),exact:true}});if(n.name)result.push({kind:'text',value:String(n.name),spec:{kind:'text',text:String(n.name),exact:true}});result.push({kind:'role',value:String(n.role||'custom'),spec:{kind:'role',role:String(n.role||'custom')}});return result; }
    function segmentMatches(n,segment) { if(segment.kind==='testId')return String(n.automationId||'')===segment.value;if(segment.kind==='text')return String(n.name||'')===segment.value;return String(n.role||'custom')===segment.value&&(!segment.name||String(n.name||'')===segment.name); }
    function descendants(n) { const result=[];const visit=parent=>(parent.children||[]).forEach(child=>{result.push(child);visit(child)});visit(n);return result; }
    function directUniqueSegment(n) { const searchable=nodes.filter(node=>node!==root);return locatorSegments(n).find(segment=>{const matches=searchable.filter(node=>segmentMatches(node,segment));return matches.length===1&&matches[0]===n}); }
    function uniqueLocatorPlan(n) { const direct=directUniqueSegment(n);if(direct)return [direct];for(let ancestor=n._parent;ancestor&&ancestor!==root;ancestor=ancestor._parent){const anchor=directUniqueSegment(ancestor);if(!anchor)continue;const scoped=descendants(ancestor);const target=locatorSegments(n).find(segment=>{const matches=scoped.filter(node=>segmentMatches(node,segment));return matches.length===1&&matches[0]===n});if(target)return [anchor,target]}return null; }
    function locator(n) { const searchable=nodes.filter(node=>node!==root),plan=uniqueLocatorPlan(n)||[locatorSegments(n).map((segment,index)=>({segment,index,count:searchable.filter(node=>segmentMatches(node,segment)).length})).sort((a,b)=>a.count-b.count||a.index-b.index)[0].segment];return plan.map(segment=>`aw=${JSON.stringify(JSON.stringify(segment.spec))}`).join(' '); }
    function quoted(value) { return JSON.stringify(String(value)); }
    function rustQuoted(value) { value=String(value); let hashes=''; while(value.includes(`"${hashes}`)) hashes+='#'; return `r${hashes}"${value}"${hashes}`; }
    function clientSegment(segment,client,base) { const value=client==='Rust'?rustQuoted(segment.value):quoted(segment.value);if(segment.kind==='testId')return `${base}.${client==='TypeScript'?'getByTestId':client==='Python'?'get_by_test_id':client==='Java'?'getByTestId':client==='Go'?'GetByTestId':'get_by_test_id'}(${value})`;if(segment.kind==='text')return `${base}.${client==='TypeScript'?'getByText':client==='Python'?'get_by_text':client==='Java'?'getByText':client==='Go'?'GetByText':'get_by_text_with_options'}(${value}${client==='TypeScript'?', { exact: true }':client==='Python'?', exact=True':client==='Java'?', new TextOptions(true)':client==='Go'?', allwright.TextOptions{Exact: true}':', TextOptions { exact: true }'})`;const name=segment.name&&(client==='Rust'?rustQuoted(segment.name):quoted(segment.name));if(client==='TypeScript')return `${base}.getByRole(${value}${name?`, { name: ${name}, exact: true }`:''})`;if(client==='Python')return `${base}.get_by_role(${value}${name?`, name=${name}, exact=True`:''})`;if(client==='Java')return `${base}.getByRole(${value}${name?`, new RoleOptions().setName(${name}).setExact(true)`:''})`;if(client==='Go')return `${base}.GetByRole(${value}${name?`, allwright.RoleOptions{Name: ${name}, Exact: true}`:''})`;return name?`${base}.get_by_role_with_options(${value}, RoleOptions { name: Some(TextMatcher::from(${name})), exact: true, ..Default::default() })`:`${base}.get_by_role(${value})`; }
    function clientLocators(n) { const plan=uniqueLocatorPlan(n),clients=['TypeScript','Python','Java','Go','Rust'];if(!plan)return [];return clients.map(client=>[client,plan.reduce((code,segment)=>clientSegment(segment,client,code),'app')]); }
    function renderTree() { $('tree').replaceChildren(treeNode(root)); }
    function treeNode(n) { const wrap=document.createElement('div'); wrap.className='node'; const row=document.createElement('div'); row.className='nodeRow'+(n===selected?' active':''); const kids=n.children||[]; row.innerHTML=`<span class="twisty">${kids.length?'▾':''}</span><span class="role">${escapeHtml(n.role||'element')}</span><span class="name">${escapeHtml(n.name||n.automationId||'')}</span>`; row.onclick=e=>{e.stopPropagation();choose(n)}; wrap.append(row); if(kids.length){const children=document.createElement('div');children.className='children';kids.forEach(k=>children.append(treeNode(k)));wrap.append(children)} return wrap; }
    function escapeHtml(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}
    function positionHighlight(n){ const b=n&&n.bounds||{}, rb=root&&root.bounds||{}, image=$('shot'); if(!b.width||!b.height){$('highlight').style.display='none';return} const sx=image.clientWidth/Math.max(1,rb.width||image.naturalWidth), sy=image.clientHeight/Math.max(1,rb.height||image.naturalHeight); Object.assign($('highlight').style,{display:'block',left:`${(b.x-(rb.x||0))*sx}px`,top:`${(b.y-(rb.y||0))*sy}px`,width:`${b.width*sx}px`,height:`${b.height*sy}px`}); }
    function choose(n){ selected=n; renderTree(); positionHighlight(n); const values={role:n.role,name:n.name,automationId:n.automationId,className:n.className,enabled:n.enabled,offscreen:n.offscreen,bounds:n.bounds}; const snippets=clientLocators(n); const locatorList=snippets.length?snippets.map(([client,code],index)=>`<div class="locatorItem"><div class="locatorHead"><span>${client}</span><button data-copy-locator="${index}">Copy</button></div><code>${escapeHtml(code)}</code></div>`).join(''):'<div class="empty">No unique locator can be formed from the attributes in this hierarchy.</div>'; $('details').innerHTML=Object.entries(values).map(([k,v])=>`<div class="property"><label>${k}</label><div>${escapeHtml(typeof v==='object'?JSON.stringify(v):String(v??''))}</div></div>`).join('')+`<div class="locator">Interact with element</div><div class="actions"><button class="primary" id="clickElement">Click / tap</button><button id="rightClickElement">Right-click</button><button id="doubleClickElement">Double-click / tap</button><button id="scrollUp">Scroll up</button><button id="scrollDown">Scroll down</button></div><div class="interactionFields"><div class="actionField"><input id="fillValue" aria-label="Fill value" placeholder="Text to fill"><button id="fillElement">Fill</button></div><div class="actionField"><input id="keyValue" aria-label="Key to press" placeholder="Enter, Tab, Escape…"><button id="pressElement">Press key</button></div></div><div class="locator">Unique locator code</div><div class="locatorList">${locatorList}</div>`; document.querySelectorAll('[data-copy-locator]').forEach(button=>button.onclick=()=>navigator.clipboard.writeText(snippets[Number(button.dataset.copyLocator)][1])); $('clickElement').onclick=()=>perform('click',n); $('rightClickElement').onclick=()=>perform('right_click',n); $('doubleClickElement').onclick=()=>perform('double_click',n); $('scrollUp').onclick=()=>perform('scroll',n,{direction:'up'}); $('scrollDown').onclick=()=>perform('scroll',n,{direction:'down'}); $('fillElement').onclick=()=>perform('fill',n,{value:$('fillValue').value}); $('pressElement').onclick=()=>perform('press',n,{key:$('keyValue').value}); $('fillValue').onkeydown=event=>{if(event.key==='Enter')$('fillElement').click()}; $('keyValue').onkeydown=event=>{if(event.key==='Enter')$('pressElement').click()}; }
    function nativePoint(event){ if(!root)return;const rect=$('shot').getBoundingClientRect(),rb=root.bounds||{};if(!rect.width||!rect.height)return;return{x:(rb.x||0)+(event.clientX-rect.left)*(rb.width/rect.width),y:(rb.y||0)+(event.clientY-rect.top)*(rb.height/rect.height)}; }
    function hitAt(event){ const p=nativePoint(event);if(!p)return;return nodes.filter(n=>{const b=n.bounds;return b&&b.width>0&&b.height>0&&p.x>=b.x&&p.x<=b.x+b.width&&p.y>=b.y&&p.y<=b.y+b.height}).sort((a,b)=>(a.bounds.width*a.bounds.height)-(b.bounds.width*b.bounds.height))[0]; }
    function sendInput(payload){inputQueue=inputQueue.then(async()=>{try{const response=await fetch('/api/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,windowId:currentWindowId})});const data=await response.json();if(!response.ok)throw new Error(data.error||response.statusText);if(data.tree){await load(data);freezeSnapshot()}return true}catch(error){$('status').className='error';$('status').textContent=error.message;return false}});return inputQueue;}
    function flushText(){clearTimeout(textTimer);if(!textBuffer)return;const text=textBuffer;textBuffer='';sendInput({kind:'keyboard',text});}
    function queueText(text){textBuffer+=text;clearTimeout(textTimer);textTimer=setTimeout(flushText,45);}
    function pick(event){if(Date.now()<suppressClickUntil)return;if(mode==='inspect'){const hit=hitAt(event);if(hit)choose(hit);return}const point=nativePoint(event);if(!point)return;clearTimeout(clickTimer);clickTimer=setTimeout(()=>sendInput({kind:'pointer',action:'tap',...point}),220);}
    function doublePick(event){if(mode!=='interact')return;const point=nativePoint(event);if(!point)return;clearTimeout(clickTimer);sendInput({kind:'pointer',action:'double_tap',...point});}
    function contextPick(event){if(mode!=='interact')return;event.preventDefault();const point=nativePoint(event);if(!point)return;clearTimeout(clickTimer);sendInput({kind:'pointer',action:'right_click',...point});}
    function pointerBegin(event){if(mode!=='interact'||event.button!==0)return;event.preventDefault();$('stage').focus();pointerStart={clientX:event.clientX,clientY:event.clientY,point:nativePoint(event),time:performance.now()};$('shot').setPointerCapture?.(event.pointerId);}
    function pointerFinish(event){if(mode!=='interact'||!pointerStart)return;const start=pointerStart,end=nativePoint(event);pointerStart=undefined;if(!start.point||!end)return;const moved=Math.hypot(event.clientX-start.clientX,event.clientY-start.clientY);if(moved<8)return;suppressClickUntil=Date.now()+400;sendInput({kind:'pointer',action:'swipe',x:start.point.x,y:start.point.y,to_x:end.x,to_y:end.y,duration_ms:Math.max(80,Math.min(1500,Math.round(performance.now()-start.time)))});}
    function wheelInteract(event){if(mode!=='interact')return;event.preventDefault();const point=nativePoint(event);if(!point)return;clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>sendInput({kind:'pointer',action:'scroll',...point,delta_x:event.deltaX,delta_y:event.deltaY,duration_ms:180}),45);}
    function keyboardInteract(event){if(mode!=='interact'||event.isComposing)return;if(event.metaKey||event.ctrlKey||event.altKey||['Shift','Control','Alt','Meta','CapsLock'].includes(event.key))return;event.preventDefault();if(event.key.length===1){queueText(event.key);return}flushText();sendInput({kind:'keyboard',key:event.key});}
    function pasteInteract(event){if(mode!=='interact')return;const text=event.clipboardData?.getData('text');if(!text)return;event.preventDefault();queueText(text);flushText();}
    async function streamFrames(generation){while(!frozen&&mode==='interact'&&generation===liveGeneration){const started=performance.now();try{const response=await fetch(`/api/frame?t=${Date.now()}`);if(!response.ok){let message=`Live frame: ${response.status}`;try{message=(await response.json()).error||message}catch{}throw new Error(message)}const frameWindowId=response.headers.get('X-Allwright-Window-Id'),blob=await response.blob();if(frozen||mode!=='interact'||generation!==liveGeneration)break;if(frameWindowId&&currentWindowId&&frameWindowId!==currentWindowId){await request('/api/snapshot');continue}const next=URL.createObjectURL(blob),image=$('shot');await new Promise((ok,no)=>{image.onload=ok;image.onerror=no;image.src=next});if(frameUrl)URL.revokeObjectURL(frameUrl);frameUrl=next;fitStage();frameCount++;const elapsed=(performance.now()-liveStarted)/1000;$('status').className='';$('status').textContent=`Live · ${(frameCount/Math.max(.1,elapsed)).toFixed(1)} fps`;}catch(error){if(generation===liveGeneration){$('status').className='error';$('status').textContent=error.message;await new Promise(resolve=>setTimeout(resolve,750));}}const wait=Math.max(0,180-(performance.now()-started));if(wait)await new Promise(resolve=>setTimeout(resolve,wait));}}
    function freezeSnapshot(){if(frozen)return;frozen=true;liveGeneration++;if(mode==='interact')flushText();mode='inspect';document.body.classList.remove('interactMode');$('inspectMode').classList.add('active');$('interactMode').classList.remove('active');$('freeze').classList.add('active');$('freeze').textContent='Frozen';$('status').className='';$('status').textContent=`Frozen · ${nodes.length} elements`;}
    async function captureAndFreeze(){if(frozen)return;if(mode==='interact'){liveGeneration++;if(!await request('/api/snapshot'))return}freezeSnapshot();}
    async function unfreezeSnapshot(){if(!frozen)return;frozen=false;$('freeze').classList.remove('active');$('freeze').textContent='Freeze';await request('/api/snapshot');}
    function setMode(next){if(frozen){frozen=false;$('freeze').classList.remove('active');$('freeze').textContent='Freeze'}if(mode===next)return;if(mode==='interact')flushText();mode=next;liveGeneration++;document.body.classList.toggle('interactMode',mode==='interact');$('inspectMode').classList.toggle('active',mode==='inspect');$('interactMode').classList.toggle('active',mode==='interact');if(mode==='interact'){$('highlight').style.display='none';$('stage').focus();frameCount=0;liveStarted=performance.now();$('status').textContent='Starting live view…';streamFrames(liveGeneration)}else{$('status').textContent='Refreshing hierarchy…';request('/api/snapshot');}}
    function fitStage(){ const wrap=$('stageWrap'), stage=$('stage'), image=$('shot'); if(!image.naturalWidth||!image.naturalHeight)return; const style=getComputedStyle(wrap), availableWidth=Math.max(1,wrap.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight)), availableHeight=Math.max(1,wrap.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom)), scale=Math.min(1,availableWidth/image.naturalWidth,availableHeight/image.naturalHeight); stage.style.width=`${image.naturalWidth*scale}px`;stage.style.height=`${image.naturalHeight*scale}px`;if(selected)positionHighlight(selected); }
    function renderWindows(payload){const control=$('windowControl'),select=$('windowSelect');if(!Array.isArray(payload.windows)){control.hidden=true;return}control.hidden=false;const current=payload.windows.find(window=>window.window_id===payload.currentWindowId),follow=document.createElement('option');follow.value='';follow.textContent=`Follow main window${current?` — ${current.title||current.window_id}`:''}`;select.replaceChildren(follow);for(const window of payload.windows){const option=document.createElement('option');option.value=window.window_id;option.textContent=`${window.is_main?'● ':'○ '}${window.title||window.window_id}`;select.append(option)}select.value=payload.selectedWindowId||'';}
    async function load(payload){ root=payload.tree.root;currentWindowId=payload.currentWindowId||null; $('surface').textContent=`${payload.surface} · ${payload.backend}`;renderWindows(payload); nodes=[];flatten(root); const image=$('shot'); await new Promise((ok,no)=>{image.onload=ok;image.onerror=no;image.src=payload.image}); fitStage(); renderTree(); selected=undefined;$('highlight').style.display='none';$('details').innerHTML='<div class="empty">Choose an element in the screenshot or hierarchy.</div>'; }
    async function request(path,options){ $('status').className='';$('status').textContent='Loading…';try{const response=await fetch(path,options);const data=await response.json();if(!response.ok)throw new Error(data.error||response.statusText);await load(data);$('status').textContent=`${nodes.length} elements`;return true}catch(error){$('status').className='error';$('status').textContent=error.message;return false}}
    async function perform(action,n=selected,extra={}){if(!n)return;const selector=locator(n),ok=await request('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,selector,windowId:currentWindowId,...extra})});if(ok){if(action==='right_click')freezeSnapshot();const current=nodes.find(node=>locator(node)===selector);if(current)choose(current)}}
    async function switchWindow(){if(mode==='interact')flushText();frozen=false;$('freeze').classList.remove('active');$('freeze').textContent='Freeze';liveGeneration++;const ok=await request('/api/window',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({windowId:$('windowSelect').value||null})});if(ok&&mode==='interact'){frameCount=0;liveStarted=performance.now();$('stage').focus();streamFrames(liveGeneration)}}
    async function pollWindows(){if(frozen||windowPollBusy||$('windowControl').hidden)return;windowPollBusy=true;try{const response=await fetch('/api/windows');if(!response.ok)return;const payload=await response.json();const changed=payload.currentWindowId&&payload.currentWindowId!==currentWindowId;renderWindows(payload);if(changed)await request('/api/snapshot')}finally{windowPollBusy=false}}
    $('shot').addEventListener('click',pick); $('shot').addEventListener('dblclick',doublePick); $('shot').addEventListener('contextmenu',contextPick); $('shot').addEventListener('pointerdown',pointerBegin); $('shot').addEventListener('pointerup',pointerFinish); $('shot').addEventListener('pointercancel',()=>pointerStart=undefined); $('shot').addEventListener('wheel',wheelInteract,{passive:false}); $('stage').addEventListener('keydown',keyboardInteract); $('stage').addEventListener('paste',pasteInteract); $('inspectMode').onclick=()=>setMode('inspect'); $('interactMode').onclick=()=>setMode('interact'); $('freeze').onclick=()=>frozen?unfreezeSnapshot():captureAndFreeze(); $('windowSelect').onchange=switchWindow; $('refresh').onclick=()=>{frozen=false;$('freeze').classList.remove('active');$('freeze').textContent='Freeze';request('/api/snapshot')}; window.addEventListener('keydown',event=>{if(event.key==='F8'){event.preventDefault();frozen?unfreezeSnapshot():captureAndFreeze()}}); window.addEventListener('resize',fitStage); request('/api/snapshot');
    setInterval(pollWindows,800);
  </script>
</body>
</html>
