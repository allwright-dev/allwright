[package]
name = "allwright-surface-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Web surface plugin for the allwright engine."
readme = "README.md"
keywords = ["automation", "browser", "cdp", "bidi"]
categories = ["development-tools::testing", "api-bindings"]

[features]
default = []
runtime = []

[[bin]]
name = "allwright-surface-web"
path = "src/main.rs"
required-features = ["runtime"]

[dependencies]
allwright = { package = "allwright-core", path = "../allwright", version = "0.0.7" }
allwright-plugin-sdk = { path = "../allwright-plugin-sdk", version = "0.0.7" }
clap = { workspace = true, features = ["derive"] }
futures-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-tungstenite = { workspace = true }
tonic = { workspace = true }
