[workspace]
resolver = "3"
members = [
    "xtask",
    "rust/allwright-plugin-sdk",
    "rust/allwright-surface-web",
    "rust/allwright-surface-mobile",
    "rust/allwright-surface-mobile-android",
    "rust/allwright-surface-mobile-ios",
    "rust/allwright-surface-desktop",
    "rust/allwright-surface-desktop-mac",
    "rust/allwright-surface-desktop-windows",
    "rust/allwright-surface-desktop-linux",
    "rust/allwright",
    "rust/allwright-cli",
]

[workspace.package]
version = "0.0.46"
edition = "2024"
license = "MIT"
repository = "https://github.com/allwright-dev/allwright"
homepage = "https://allwright.dev"

[workspace.dependencies]
clap = "4.6.6"
flate2 = "1.1.2"
futures-util = "0.3.31"
libloading = "0.8.9"
prost = "0.13.5"
protoc-bin-vendored = "3.1.0"
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
tar = "0.4.44"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.19"
tokio-tungstenite = "0.27.0"
tonic = { version = "0.12.3", features = ["transport"] }
tonic-build = "0.12.3"
zip = { version = "5.1.1", default-features = false, features = ["deflate-flate2"] }
