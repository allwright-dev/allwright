[workspace]
resolver = "3"
members = [
    "rust/allwright",
]

[workspace.dependencies]
futures-util = "0.3.31"
prost = "0.13.5"
serde_json = "1.0.145"
tokio-tungstenite = "0.27.0"
tonic = { version = "0.12.3", features = ["transport"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.19"
