name: Release Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-go-module:
    name: Publish Go module
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Verify Go module
        working-directory: go
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test ./...

      - name: Create Go module tag
        env:
          ROOT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          go_tag="go/${ROOT_TAG}"

          if git rev-parse --verify --quiet "refs/tags/${go_tag}" >/dev/null; then
            echo "Go tag ${go_tag} already exists; skipping creation"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${go_tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${go_tag}"

      - name: Warm Go module proxy
        env:
          ROOT_TAG: ${{ github.ref_name }}
        run: |
          GOPROXY=https://proxy.golang.org,direct go list -m "allwright.dev@${ROOT_TAG}"

  publish-python-package:
    name: Publish Python package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/allwright/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync Python package version from tag
        shell: bash
        run: |
          chmod +x ./scripts/sync-python-version.sh
          ./scripts/sync-python-version.sh "${GITHUB_REF_NAME#v}"

      - name: Install Python build tools
        run: python -m pip install --upgrade build

      - name: Build Python distributions
        working-directory: python
        run: python -m build

      - name: Publish Python package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

  publish-java-package:
    name: Publish Java package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ALLWRIGHT_VERSION: ${{ github.ref_name }}
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure Maven Central secrets are configured
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in OSSRH_USERNAME OSSRH_PASSWORD SIGNING_KEY SIGNING_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "${name} is not configured. Add it to the repository secrets to enable Java publishing." >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Publish Java package
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./java/gradlew
          export ALLWRIGHT_VERSION="${GITHUB_REF_NAME#v}"
          ./java/gradlew -p java publishAllPublicationsToCentralPortalRepository

      - name: Transfer Java deployment into Central Portal
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${OSSRH_USERNAME}:${OSSRH_PASSWORD}" | base64 | tr -d '\n')"
          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${token}" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/dev.allwright?publishing_type=automatic"

  publish-npm-package:
    name: Publish npm package
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync npm package version from tag
        shell: bash
        run: |
          chmod +x ./scripts/sync-npm-version.sh
          ./scripts/sync-npm-version.sh "${GITHUB_REF_NAME#v}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Install Bun dependencies
        run: bun install

      - name: Build npm package
        run: bun run build

      - name: Publish npm core package
        run: npm publish --workspace @allwright.dev/core --access public

      - name: Publish npm Vitest package
        run: npm publish --workspace @allwright.dev/vitest --access public

      - name: Publish npm project initializer
        run: npm publish --workspace create-allwright --access public

  publish-crates:
    name: Publish Rust crates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      CARGO_PUBLISH_ALLOW_DIRTY: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure crates.io token is configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN is not configured. Add it to the repository secrets to enable crates.io publishing." >&2
            exit 1
          fi

      - name: Sync workspace version from tag
        shell: bash
        run: |
          chmod +x ./scripts/sync-version.sh
          ./scripts/sync-version.sh "${GITHUB_REF_NAME#v}"

      - name: Verify Rust package versions match tag
        shell: bash
        run: bash ./scripts/verify-rust-release-version.sh "${GITHUB_REF_NAME}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish all crates.io packages
        shell: bash
        env:
          ALLOW_EXPERIMENTAL_SURFACES: "1"
        run: ./scripts/publish-crates.sh publish full

  ensure-github-release:
    name: Ensure GitHub release exists
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create release when absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exit 0
            fi
            if gh release create "$TAG_NAME" --verify-tag --title "$TAG_NAME" --notes "" --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            if [[ "$attempt" -lt 5 ]]; then
              sleep_seconds=$((attempt * 10))
              echo "GitHub release lookup/create attempt ${attempt}/5 failed; retrying in ${sleep_seconds}s"
              sleep "$sleep_seconds"
            fi
          done
          echo "failed to find or create GitHub release $TAG_NAME" >&2
          exit 1

  release-allwright-cli:
    name: Release allwright CLI (${{ matrix.target }})
    needs: ensure-github-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            binary_name: allwright
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            binary_name: allwright.exe
          - runner: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            binary_name: allwright

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync workspace version from tag
        shell: bash
        run: |
          chmod +x ./scripts/sync-version.sh
          ./scripts/sync-version.sh "${GITHUB_REF_NAME#v}"

      - name: Verify Rust package versions match tag
        shell: bash
        run: bash ./scripts/verify-rust-release-version.sh "${GITHUB_REF_NAME}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build allwright CLI
        run: cargo build -p allwright --release --target ${{ matrix.target }}

      - name: Verify allwright CLI version
        shell: bash
        env:
          BINARY_NAME: ${{ matrix.binary_name }}
          TARGET: ${{ matrix.target }}
        run: |
          target_arch="${TARGET%%-*}"
          host_arch="$(uname -m)"
          if [[ "$host_arch" == "arm64" ]]; then
            host_arch="aarch64"
          fi
          if [[ "$target_arch" != "$host_arch" ]]; then
            echo "Skipping execution of ${TARGET} binary on ${host_arch} host; Cargo metadata version was verified above."
            exit 0
          fi
          actual="$("target/${TARGET}/release/${BINARY_NAME}" --version)"
          expected="allwright ${GITHUB_REF_NAME#v}"
          if [[ "$actual" != "$expected" ]]; then
            echo "CLI version mismatch: got '$actual', expected '$expected'" >&2
            exit 1
          fi

      - name: Package release asset
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          BINARY_NAME: ${{ matrix.binary_name }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          asset_name="allwright-${TAG_NAME}-${TARGET}.${ARCHIVE_EXT}"
          package_root="dist/package"
          asset_path="dist/${asset_name}"

          rm -rf "$package_root" dist
          mkdir -p "$package_root/bin"
          cp "target/${TARGET}/release/${BINARY_NAME}" "$package_root/bin/${BINARY_NAME}"

          if [[ "$ARCHIVE_EXT" == "zip" ]]; then
            powershell -Command "Compress-Archive -Path 'dist/package/*' -DestinationPath 'dist/${asset_name}'"
          else
            tar -C "$package_root" -czf "$asset_path" .
          fi

          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"
          echo "asset_path=${asset_path}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
        run: bash ./scripts/upload-release-asset.sh "$TAG_NAME" "$ASSET_PATH"

  release-desktop-mac-plugin:
    name: Release desktop-mac plugin (${{ matrix.target }})
    needs: ensure-github-release
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            xcode_arch: arm64
          - target: x86_64-apple-darwin
            xcode_arch: x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync workspace version from tag
        shell: bash
        run: |
          chmod +x ./scripts/sync-version.sh
          ./scripts/sync-version.sh "${GITHUB_REF_NAME#v}"

      - name: Verify Rust package versions match tag
        shell: bash
        run: bash ./scripts/verify-rust-release-version.sh "${GITHUB_REF_NAME}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build desktop-mac plugin library
        run: cargo build -p allwright-surface-desktop-mac --release --target ${{ matrix.target }}

      - name: Build macOS XCUITest agent
        env:
          XCODE_ARCH: ${{ matrix.xcode_arch }}
        run: |
          xcodebuild build-for-testing \
            -project swiftui/AllwrightIOSAgent/AllwrightIOSAgent.xcodeproj \
            -scheme AllwrightIOSAgent \
            -configuration Release \
            -destination "platform=macOS,arch=${XCODE_ARCH}" \
            -derivedDataPath target/mac-agent-derived \
            SDKROOT=macosx \
            SUPPORTED_PLATFORMS=macosx \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            ARCHS="${XCODE_ARCH}" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package release asset
        id: package
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          asset_name="allwright-surface-desktop-mac-${TAG_NAME}-${TARGET}.tar.gz"
          package_root="dist/package"
          asset_path="dist/${asset_name}"

          rm -rf "$package_root" dist
          mkdir -p "$package_root/lib" "$package_root/agent/Release"
          cp "target/${TARGET}/release/liballwright_surface_desktop_mac.dylib" "$package_root/lib/"
          cp target/mac-agent-derived/Build/Products/*.xctestrun "$package_root/agent/"
          cp -R target/mac-agent-derived/Build/Products/Release/AllwrightAgentUITests-Runner.app "$package_root/agent/Release/"
          cp swiftui/AllwrightIOSAgent/AllwrightAgentUITests/AllwrightAgentUITests.mac-runtime.entitlements "$package_root/agent/"
          tar -C "$package_root" -czf "$asset_path" .

          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"
          echo "asset_path=${asset_path}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
        run: bash ./scripts/upload-release-asset.sh "$TAG_NAME" "$ASSET_PATH"

  release-desktop-windows-plugin:
    name: Release desktop-windows plugin (x86_64-pc-windows-msvc)
    needs: ensure-github-release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync workspace version from tag
        shell: bash
        run: |
          chmod +x ./scripts/sync-version.sh
          ./scripts/sync-version.sh "${GITHUB_REF_NAME#v}"

      - name: Verify Rust package versions match tag
        shell: bash
        run: bash ./scripts/verify-rust-release-version.sh "${GITHUB_REF_NAME}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build plugin library
        run: cargo build -p allwright-surface-desktop-windows --release --target x86_64-pc-windows-msvc

      - name: Publish self-contained FlaUI agent
        run: dotnet publish rust/allwright-surface-desktop-windows/agent/Allwright.WindowsAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o target/windows-agent

      - name: Package release asset
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $assetName = "allwright-surface-desktop-windows-$env:TAG_NAME-x86_64-pc-windows-msvc.zip"
          New-Item -ItemType Directory -Force -Path dist/package/lib, dist/package/agent | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/allwright_surface_desktop_windows.dll dist/package/lib/
          Copy-Item target/windows-agent/Allwright.WindowsAgent.exe dist/package/agent/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/$assetName"
          "asset_name=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "asset_path=dist/$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        id: package

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
        run: bash ./scripts/upload-release-asset.sh "$TAG_NAME" "$ASSET_PATH"

  release-web-plugin:
    name: Release web plugin (${{ matrix.target }})
    needs: ensure-github-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            library_name: liballwright_surface_web.so
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            library_name: allwright_surface_web.dll
          - runner: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            library_name: liballwright_surface_web.dylib

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync workspace version from tag
        shell: bash
        run: |
          chmod +x ./scripts/sync-version.sh
          ./scripts/sync-version.sh "${GITHUB_REF_NAME#v}"

      - name: Verify Rust package versions match tag
        shell: bash
        run: bash ./scripts/verify-rust-release-version.sh "${GITHUB_REF_NAME}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build web plugin library
        run: cargo build -p allwright-surface-web --release --target ${{ matrix.target }}

      - name: Package release asset
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          LIBRARY_NAME: ${{ matrix.library_name }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          asset_name="allwright-surface-web-${TAG_NAME}-${TARGET}.${ARCHIVE_EXT}"
          package_root="dist/package"
          asset_path="dist/${asset_name}"

          rm -rf "$package_root" dist
          mkdir -p "$package_root/lib"
          cp "target/${TARGET}/release/${LIBRARY_NAME}" "$package_root/lib/${LIBRARY_NAME}"

          if [[ "$ARCHIVE_EXT" == "zip" ]]; then
            powershell -Command "Compress-Archive -Path 'dist/package/*' -DestinationPath 'dist/${asset_name}'"
          else
            tar -C "$package_root" -czf "$asset_path" .
          fi

          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"
          echo "asset_path=${asset_path}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
        run: bash ./scripts/upload-release-asset.sh "$TAG_NAME" "$ASSET_PATH"

  release-mobile-android-plugin:
    name: Release mobile-android plugin (${{ matrix.target }})
    needs: ensure-github-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            library_name: liballwright_surface_mobile_android.so
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            library_name: allwright_surface_mobile_android.dll
          - runner: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            library_name: liballwright_surface_mobile_android.dylib

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync workspace version from tag
        shell: bash
        run: |
          chmod +x ./scripts/sync-version.sh
          ./scripts/sync-version.sh "${GITHUB_REF_NAME#v}"

      - name: Verify Rust package versions match tag
        shell: bash
        run: bash ./scripts/verify-rust-release-version.sh "${GITHUB_REF_NAME}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build mobile-android plugin library
        run: cargo build -p allwright-surface-mobile-android --release --target ${{ matrix.target }}

      - name: Package release asset
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          LIBRARY_NAME: ${{ matrix.library_name }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          asset_name="allwright-surface-mobile-android-${TAG_NAME}-${TARGET}.${ARCHIVE_EXT}"
          package_root="dist/package"
          asset_path="dist/${asset_name}"

          rm -rf "$package_root" dist
          mkdir -p "$package_root/lib"
          cp "target/${TARGET}/release/${LIBRARY_NAME}" "$package_root/lib/${LIBRARY_NAME}"

          if [[ "$ARCHIVE_EXT" == "zip" ]]; then
            powershell -Command "Compress-Archive -Path 'dist/package/*' -DestinationPath 'dist/${asset_name}'"
          else
            tar -C "$package_root" -czf "$asset_path" .
          fi

          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"
          echo "asset_path=${asset_path}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
        run: bash ./scripts/upload-release-asset.sh "$TAG_NAME" "$ASSET_PATH"

  release-mobile-ios-plugin:
    name: Release mobile-ios plugin (${{ matrix.target }})
    needs: ensure-github-release
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync workspace version from tag
        shell: bash
        run: |
          chmod +x ./scripts/sync-version.sh
          ./scripts/sync-version.sh "${GITHUB_REF_NAME#v}"

      - name: Verify Rust package versions match tag
        shell: bash
        run: bash ./scripts/verify-rust-release-version.sh "${GITHUB_REF_NAME}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build mobile-ios plugin library
        run: cargo build -p allwright-surface-mobile-ios --release --target ${{ matrix.target }}

      - name: Build simulator and physical-device XCUITest agents
        run: |
          xcodebuild build-for-testing \
            -project swiftui/AllwrightIOSAgent/AllwrightIOSAgent.xcodeproj \
            -scheme AllwrightIOSAgent \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath target/ios-agent-simulator-derived \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=-

          xcodebuild build-for-testing \
            -project swiftui/AllwrightIOSAgent/AllwrightIOSAgent.xcodeproj \
            -scheme AllwrightIOSAgent \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath target/ios-agent-device-derived \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package release asset
        id: package
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          asset_name="allwright-surface-mobile-ios-${TAG_NAME}-${TARGET}.tar.gz"
          package_root="dist/package"
          asset_path="dist/${asset_name}"

          rm -rf "$package_root" dist
          mkdir -p \
            "$package_root/lib" \
            "$package_root/agent/simulator/Release-iphonesimulator" \
            "$package_root/agent/device/Release-iphoneos"
          cp "target/${TARGET}/release/liballwright_surface_mobile_ios.dylib" "$package_root/lib/"
          cp target/ios-agent-simulator-derived/Build/Products/*.xctestrun "$package_root/agent/simulator/"
          cp -R target/ios-agent-simulator-derived/Build/Products/Release-iphonesimulator/AllwrightAgentUITests-Runner.app "$package_root/agent/simulator/Release-iphonesimulator/"
          cp target/ios-agent-device-derived/Build/Products/*.xctestrun "$package_root/agent/device/"
          cp -R target/ios-agent-device-derived/Build/Products/Release-iphoneos/AllwrightAgentUITests-Runner.app "$package_root/agent/device/Release-iphoneos/"
          tar -C "$package_root" -czf "$asset_path" .

          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"
          echo "asset_path=${asset_path}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
        run: bash ./scripts/upload-release-asset.sh "$TAG_NAME" "$ASSET_PATH"
