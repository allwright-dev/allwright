name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-go-proto:
    name: Verify Go proto output
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.1"

      - name: Regenerate Go proto bindings
        run: ./scripts/generate-go-proto.sh

      - name: Ensure generated Go proto is committed
        run: git diff --exit-code -- go/gen/allwright/engine/v1

  verify-rust-proto:
    name: Verify Rust proto output
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Regenerate Rust proto bindings
        run: ./scripts/generate-rust-proto.sh

      - name: Ensure generated Rust proto is committed
        run: git diff --exit-code -- rust/allwright/src/proto_generated.rs rust/allwright/src/allwright.engine.v1.rs

  test-rust-mobile-android:
    name: Test Rust Android plugin crate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Android plugin tests
        run: cargo test -p allwright-surface-mobile-android

  test-java-client:
    name: Test Java client
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Java tests
        shell: bash
        run: |
          chmod +x ./java/gradlew
          ./java/gradlew -p java test
