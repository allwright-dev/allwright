syntax = "proto3";

package allwright.engine.v1;
option go_package = "allwright.dev/gen/allwright/engine/v1;enginev1";
option java_package = "dev.allwright.engine.v1";
option java_multiple_files = true;

import "core/v1/common.proto";

enum BrowserKind {
  BROWSER_KIND_UNSPECIFIED = 0;
  BROWSER_KIND_CHROMIUM = 1;
  BROWSER_KIND_FIREFOX = 2;
}

message LaunchBrowserCommand {
  BrowserKind browser_kind = 1;
  optional string browser_binary = 2;
  optional CommandRetryOptions retry_options = 3;
}

message BrowserLaunchedEvent {
  BrowserKind browser_kind = 1;
  string browser = 2;
  string note = 3;
  string user_data_dir = 4;
  string initial_page_session_id = 5;
}

message LaunchChromeCommand {
  optional string chrome_binary = 1;
  optional CommandRetryOptions retry_options = 2;
}

message ChromeLaunchedEvent {
  string browser = 1;
  string note = 2;
  string cdp_websocket_url = 3;
  string user_data_dir = 4;
  string initial_page_session_id = 5;
}

message RegisterNewPageHook {}

message NewPageHookResult {
  string context_session_id = 1;
  string note = 2;
}

message RegisterFileChooserHook {}

message FileChooserHookResult {
  string file_chooser_id = 1;
  bool is_multiple = 2;
  string note = 3;
}

message SetFileChooserFilesCommand {
  string file_chooser_id = 1;
  repeated string file_ids = 2;
  optional CommandRetryOptions retry_options = 3;
}

message FileChooserFilesSetEvent {
  string file_chooser_id = 1;
  repeated string file_ids = 2;
  string note = 3;
}

message RegisterDownloadHook {}

message DownloadHookResult {
  string download_id = 1;
  string url = 2;
  string suggested_filename = 3;
  string note = 4;
}

message SaveDownloadCommand {
  string download_id = 1;
  optional CommandRetryOptions retry_options = 2;
}

message DownloadSavedEvent {
  string download_id = 1;
  string file_id = 2;
  string suggested_filename = 3;
  uint64 size = 4;
  string note = 5;
}
