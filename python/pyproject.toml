[project]
name = "allwright-python"
version = "0.1.0"
description = "High-level Python client for the allwright engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "grpcio>=1.74.0,<2",
  "grpcio-tools>=1.74.0,<2",
  "protobuf>=5,<7",
  "PyYAML>=6,<7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["allwright"]

[tool.setuptools.package-data]
allwright = [
  "proto/core/v1/*.proto",
  "proto/engine/v1/*.proto",
  "proto/surfaces/web/v1/*.proto",
]
